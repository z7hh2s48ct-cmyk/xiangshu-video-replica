[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Default migration URL (internal P0 SQLite). VIDEO_REPLICA_DATABASE_URL takes
# precedence over this value when set (the postgresql:// scheme is rewritten to
# the psycopg3 driver automatically), so operators can target PostgreSQL
# without editing this file -- see migrations/env.py:resolve_migration_url.
# Note: offline mode (`alembic upgrade --sql`) is not supported for this chain
# (revision ids exceed Alembic's offline VARCHAR(32) version table).
sqlalchemy.url = sqlite:///data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
