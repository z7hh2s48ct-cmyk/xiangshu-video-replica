[package]
name = "video-replica-desktop"
version = "2.4.1"
description = "Internal video replica desktop app"
authors = ["Internal AI Team"]
edition = "2021"

[lib]
name = "video_replica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CW-021: the customer cloud edition is the only desktop product. The former
# local sidecar feature (which auto-started the bundled local FastAPI/Worker
# sidecar for the internal edition) and the internal opt-in overlay were
# removed together with the startup code in `lib.rs`, so no local business
# source of truth can be compiled back in — neither by default nor opt-in.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：本地缓存的视频要用 asset 协议喂给 <video>（WebView 读不了
# file://）。它在 tauri.conf.json 里与 assetProtocol.scope 成对出现，缺任意一半
# tauri 的构建脚本都会直接报错——这是好事，省得运行时才发现放不了。
tauri = { version = "2", features = ["protocol-asset"] }
# 桌面自动更新用官方 updater 插件：清单检查、下载、minisign 签名校验与安装
# 一条龙，公钥编译进包（tauri.customer.conf.json 的 plugins.updater.pubkey），
# 私钥只存在于签名机。配置只放在 customer overlay 里，dev（不带 overlay 的
# tauri:dev）不会具备更新能力；CI 的无签名构建也不生成 updater 制品。
tauri-plugin-updater = "2"
# serde / serde_json / uuid are already resolved in the locked tree by the
# Tauri dependency graph itself (Cargo.lock pins uuid 1.24) 鈥?declaring them
# here adds no new external code to the audit surface, it only re-uses what
# is locked (搂10.2 dependency-review posture for the credential vault).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24", features = ["v4"] }

# P2 客户端本地缓存：视频号原片改为客户端直取，平台不再代理下载，因此需要
# 并发 Range 分段 + 可取消/超时语义。选 reqwest + rustls 而非 WinHTTP：前者在
# Windows 上同样不引入系统 TLS 依赖，且并发语义现成。这确实扩大了第三方审计
# 面，属 §10.2 依赖评审范围，不是顺手加的工具库。
# 刻意不开 `stream`：分片读取用 reqwest 自带的 `Response::chunk()` 就够，
# 开了会连带拉进 futures-util，而本模块并不需要 StreamExt。
# 也显式关掉 default features，避免同时拉进 native-tls/schannel 两套 TLS 后端。
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "system-proxy",
] }

# tokio 本就在依赖树里（tauri 的直接依赖，Cargo.lock 已锁 1.53），此处只是把它
# 提升为直接依赖以便使用异步文件与信号量，不新增任何外部代码。运行时由 tauri 提供，
# 因此只显式声明本模块真正用到的三个 feature。
tokio = { version = "1", features = ["fs", "io-util", "sync"] }

# Already locked by Tauri/Wry. Observe the Windows completion callback instead
# of reporting success when the asynchronous clear request is merely accepted.
# 版本与 tauri 2.12 的依赖树对齐（updater 插件 2.13 要求 tauri ^2.12，连带
# webview2-com 0.39 / windows-core 0.62）；钉死是为了与 publish_accounts 的
# COM 接口转换保持单一 windows-core 版本，避免双版本让 cast 消失。
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
