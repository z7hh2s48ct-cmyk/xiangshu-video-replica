[package]
name = "video-replica-desktop"
version = "2.2.0"
description = "Internal video replica desktop app"
authors = ["Internal AI Team"]
edition = "2021"

[lib]
name = "video_replica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CW-021: the customer cloud edition is the only desktop product. The former
# local sidecar feature (which auto-started the bundled local FastAPI/Worker
# sidecar for the internal edition) and the internal opt-in overlay were
# removed together with the startup code in `lib.rs`, so no local business
# source of truth can be compiled back in — neither by default nor opt-in.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# serde / serde_json / uuid are already resolved in the locked tree by the
# Tauri dependency graph itself (Cargo.lock pins uuid 1.24) 鈥?declaring them
# here adds no new external code to the audit surface, it only re-uses what
# is locked (搂10.2 dependency-review posture for the credential vault).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24", features = ["v4"] }

# Already locked by Tauri/Wry. Observe the Windows completion callback instead
# of reporting success when the asynchronous clear request is merely accepted.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
