name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Customer HTTPS API origin
        type: string
        required: true
        default: https://video.zszhj.cn
  push:
    # The task branch makes the first build reviewable before merging to main.
    branches: [main, feat/desktop-actions-20260917]
    # v* 标签是正式发布入口：打 tag 必发三平台包并挂到 GitHub Releases
    # （标签推送不适用 paths 过滤，保证发版不受改动路径影响）。
    tags: ['v*']
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.cargo/**'
      - '.github/workflows/desktop-build.yml'
      - 'scripts/release/collect-desktop-artifacts.mjs'
      - 'scripts/require_customer_api_base.mjs'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-windows-binaries:
    name: Build LGPL ffmpeg for the Windows installer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 客户云安装包需要 ffmpeg 做本地抽音轨；Windows runner 跑不了 Linux 容器，
      # 因此在 Linux 上交叉编译出 Windows exe，再以 artifact 交给 windows 构建。
      # 脚本内部对二进制做 LGPL 静态断言，产物一定是 LGPL 构建。
      - name: Cross-compile static Windows ffmpeg/ffprobe (LGPL)
        run: bash scripts/ffmpeg-minimal/build.sh "$RUNNER_TEMP/ffmpeg-out"
      - name: Upload ffmpeg binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-lgpl
          path: ${{ runner.temp }}/ffmpeg-out/*.exe
          if-no-files-found: error
          retention-days: 1

  build:
    needs: ffmpeg-windows-binaries
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_dir: nsis
            config: src-tauri/tauri.customer.conf.json
            binary_arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app
            bundle_dir: dmg
            config: src-tauri/tauri.macos.conf.json
            binary_arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            bundle_dir: dmg
            config: src-tauri/tauri.macos.conf.json
            binary_arch: x86_64
    defaults:
      run:
        shell: bash
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://video.zszhj.cn' }}
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE_CONFIG: ${{ matrix.config }}
      BUNDLE_TYPES: ${{ matrix.bundles }}
      BUNDLE_DIR: ${{ matrix.bundle_dir }}
      BINARY_ARCH: ${{ matrix.binary_arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate customer API origin
        run: npm run require:customer-api-base
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Scan source for secrets
        run: npm run check:security
      # bundle.resources 现在包含 ffmpeg.exe/ffprobe.exe，缺失会让 tauri build
      # 直接失败，所以必须在打包前把 ffmpeg 产物放到 resources/ffmpeg/。
      - name: Download ffmpeg binaries
        if: runner.os == 'Windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ffmpeg-windows-lgpl
          path: client/src-tauri/resources/ffmpeg
      - name: Build desktop installer
        run: |
          sign_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sign_args=(--no-sign)
          fi
          npm run tauri --workspace client -- build \
            --config "$BUNDLE_CONFIG" --bundles "$BUNDLE_TYPES" \
            --target "$RUST_TARGET" --ci "${sign_args[@]}" \
            -- --locked --no-default-features
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          apps=(".cargo-target/$RUST_TARGET/release/bundle/macos/"*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          stage=$(mktemp -d "$RUNNER_TEMP/desktop-dmg.XXXXXX")
          ditto "${apps[0]}" "$stage/$(basename "${apps[0]}")"
          ln -s /Applications "$stage/Applications"
          version=$(node -p 'require("./package.json").version')
          output=".cargo-target/$RUST_TARGET/release/bundle/dmg"
          mkdir -p "$output"
          # Native image creation does not need a Finder automation session.
          hdiutil create -volname "众墅之家 AI 爆款视频工具 $version" -srcfolder "$stage" \
            -format UDZO "$output/VideoReplica_${version}_${PLATFORM}.dmg"
      - name: Verify macOS application and disk image
        if: runner.os == 'macOS'
        run: |
          apps=(".cargo-target/$RUST_TARGET/release/bundle/macos/"*.app)
          images=(".cargo-target/$RUST_TARGET/release/bundle/dmg/"*.dmg)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          codesign --verify --deep --strict "${apps[0]}"
          lipo "${apps[0]}/Contents/MacOS/video-replica-desktop" -verify_arch "$BINARY_ARCH"
          hdiutil verify "${images[0]}"
      - name: Collect installer and provenance
        run: |
          node scripts/release/collect-desktop-artifacts.mjs "$PLATFORM" \
            ".cargo-target/$RUST_TARGET/release/bundle/$BUNDLE_DIR" \
            "output/desktop/$PLATFORM"
          # Keep provenance beside the installer; never upload the whole workspace.
          test -f "output/desktop/$PLATFORM/manifest.json"
          test -f "output/desktop/$PLATFORM/SHA256SUMS.txt"
          test -f "output/desktop/$PLATFORM/RELEASE-CHANNEL.txt"
      - name: Upload downloadable installer
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/desktop/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '### %s\n\n[下载安装包](%s)\n\nAPI: `%s`\n\n内测构建：Windows 未签名，macOS ad-hoc 签名、未公证。产物保留 7 天。\n' \
            "$PLATFORM" "$ARTIFACT_URL" "$VITE_API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    # 正式发布：只有 v* 标签触发。三个平台全部构建成功才发布，
    # 任何一个平台失败都不能挂出残缺的 Release。
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://video.zszhj.cn' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches package version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '标签 %s 与 package.json 版本 v%s 不一致，拒绝发布。\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - name: Download all installer artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-*
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          # 产物目录名带 run_number/run_attempt 后缀，还原出平台名；
          # Release 资产必须全局唯一，校验和与清单按平台改名后随包上传。
          for dir in artifacts/desktop-*/; do
            name=$(basename "$dir")
            platform=${name#desktop-}
            platform=${platform%-[0-9]*-[0-9]*}
            mkdir -p "release/$platform"
            find "$dir" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) \
              -exec cp {} "release/$platform/" \;
            [[ -n $(find "release/$platform" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print -quit) ]]
            cp "$dir/SHA256SUMS.txt" "release/$platform/SHA256SUMS-$platform.txt"
            cp "$dir/manifest.json" "release/$platform/manifest-$platform.json"
          done
          installers=$(find release -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)
          [[ "$installers" -eq 3 ]] || {
            printf '期望 3 个安装包（Win + mac 双架构），实际 %d 个。\n' "$installers" >&2
            exit 1
          }
          ls -lR release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          ## 安装包（${GITHUB_REF_NAME}）

          - Windows x86_64：NSIS 安装器（未签名，SmartScreen 首次运行需「仍要运行」）
          - macOS Apple Silicon / Intel：DMG（ad-hoc 签名、未公证，首次打开需右键 → 打开）

          每个平台目录内含 \`SHA256SUMS-<platform>.txt\` 可校验完整性；
          \`manifest-<platform>.json\` 记录版本、源码 SHA 与 API 源。

          API 源：\`${VITE_API_BASE_URL}\`
          EOF
          gh release create "$GITHUB_REF_NAME" release/*/* \
            --title "众墅之家 AI 爆款视频工具 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
