# Container-local administration remains available to pg_dump/restore.
local all all trust
local replication all trust
# No unencrypted TCP connections, even on the private compose network.
hostnossl all all all reject
hostnossl replication all all reject
hostssl all all all scram-sha-256
# Physical PITR/pg_basebackup needs its own entry; PostgreSQL still requires
# a dedicated role with REPLICATION privilege (the HBA rule does not grant it).
hostssl replication all all scram-sha-256
