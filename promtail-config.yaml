# Promtail configuration file.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: application
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          __address__: /var/log/application/*.log
          
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            request_id: request_id
            user_id: user_id
          source: log
      - labels:
          level:
          msg:
          request_id:
          user_id:
      - timestamp:
          format: RFC3339
          source: timestamp
      